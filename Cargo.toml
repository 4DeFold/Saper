[package]
name = "classic-minesweeper"
version = "0.1.0"
edition = "2021"
authors = ["Classic Minesweeper contributors"]
description = "Классический Сапёр на Rust для macOS и Apple Silicon"
license = "MIT"
repository = "https://github.com/4DeFold/Saper"
readme = "README.md"

[workspace]
members = ["crates/minesweeper-core"]

[dependencies]
macroquad = { version = "0.4.14", features = ["audio"] }
minesweeper-core = { path = "crates/minesweeper-core" }

[[bin]]
name = "classic-minesweeper"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

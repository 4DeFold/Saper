name: env-probe
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          uname -m
          rustc -vV
          cargo -V
          rustfmt -V
          cargo clippy -V
          echo "PROBE_OK $(date -u)" > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-artifact
          path: probe.txt
  macos:
    runs-on: macos-15
    steps:
      - name: Architecture
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          rustc -vV | sed -n 's/^host: /host=/p'
